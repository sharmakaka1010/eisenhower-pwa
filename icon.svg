<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="q1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="q2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="q3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="q4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base App Background (Squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- 4 Quadrant Blocks -->
  <g filter="url(#glow)">
    <!-- Q1: Top-Left (Do First - Red) -->
    <rect x="76" y="76" width="168" height="168" rx="28" fill="url(#q1Grad)"/>
    <!-- Bolt Icon -->
    <path d="M166 118 L142 162 L160 162 L150 202 L182 154 L164 154 Z" fill="#ffffff"/>

    <!-- Q2: Top-Right (Schedule - Blue) -->
    <rect x="268" y="76" width="168" height="168" rx="28" fill="url(#q2Grad)"/>
    <!-- Calendar/Clock Icon -->
    <circle cx="352" cy="160" r="32" fill="none" stroke="#ffffff" stroke-width="6"/>
    <polyline points="352,142 352,160 366,168" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

    <!-- Q3: Bottom-Left (Delegate - Amber) -->
    <rect x="76" y="268" width="168" height="168" rx="28" fill="url(#q3Grad)"/>
    <!-- Forward/Delegate Arrows Icon -->
    <path d="M142 344 L168 344 M158 334 L168 344 L158 354" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="178" cy="344" r="4" fill="#ffffff"/>
    <path d="M142 360 C142 374 154 380 168 380 C182 380 194 374 194 360" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="168" cy="330" r="12" fill="none" stroke="#ffffff" stroke-width="5"/>

    <!-- Q4: Bottom-Right (Eliminate - Slate) -->
    <rect x="268" y="268" width="168" height="168" rx="28" fill="url(#q4Grad)"/>
    <!-- Cross/Archive Icon -->
    <line x1="334" y1="334" x2="370" y2="370" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <line x1="370" y1="334" x2="334" y2="370" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Center Coordinate Cross Hair Accent -->
  <circle cx="256" cy="256" r="16" fill="#0f172a" stroke="rgba(255,255,255,0.4)" stroke-width="3"/>
  <circle cx="256" cy="256" r="5" fill="#ffffff"/>
</svg>
